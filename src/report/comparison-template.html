<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>{{COMPARISON_TITLE}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="{{COMPARISON_DESCRIPTION}}">
    <meta name="author" content="R.S. - Digital Accessibility Consulting">
    <meta name="generator" content="SureA11y">

    <meta property="og:title" content="{{COMPARISON_TITLE}}">
    <meta property="og:description" content="{{COMPARISON_DESCRIPTION}}">
    <meta property="og:type" content="report">

    <!-- Apply the reader's saved colour-theme choice before first paint so the
         document never flashes the wrong theme. The toggle button (wired in
         report.js) writes this value. Best-effort: file:// localStorage can be
         blocked, in which case it simply follows the OS (Auto). -->
    <script>
        (function () {
            try {
                var root = document.documentElement;
                root.classList.add('no-theme-transition');
                // Auto when the reader has not chosen a theme yet: the
                // report follows their system's light or dark scheme. An
                // explicit Auto/Light/Dark choice always wins on reload.
                var stored = localStorage.getItem('surea11y-report-theme');
                var choice = (stored === 'auto' || stored === 'light' || stored === 'dark') ? stored : 'auto';
                if (choice === 'light' || choice === 'dark') {
                    root.setAttribute('data-theme', choice);
                } else {
                    root.removeAttribute('data-theme');
                }
            } catch (e) { /* ignore — fall back to Auto */ }
        })();
    </script>
</head>
<body>
<!-- The document's own title, date and sources are rendered inside the
     comparison itself (the .doc-head masthead and the provenance block at the
     foot), not in this template. That way the app shows exactly what this file
     shows, and the file explains itself without the tab that produced it. The
     header below is the brand band and the theme control only. -->
<div class="report-layout">
    <div class="report-layout__main">
        <header>
            <div class="report-brand">
                <svg class="site-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SureA11y">
                    <rect width="64" height="64" rx="14" fill="#3BC98F"></rect>
                    <path d="M17 33.5 L27.5 44 L48 18" fill="none" stroke="#04150E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span class="wordmark"><span class="wordmark-sure">sure</span><span class="wordmark-a11y">a11y</span><span class="wordmark-product">compare</span></span>
            </div>
            <button type="button" class="theme-switch" data-theme-toggle aria-label="Color theme: Auto">
                <svg class="theme-switch__icon theme-switch__icon--auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                    <path d="M8 20h8M12 16v4"></path>
                </svg>
                <svg class="theme-switch__icon theme-switch__icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
                </svg>
                <svg class="theme-switch__icon theme-switch__icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"></path>
                </svg>
            </button>
        </header>
        <main class="page">
            <div class="compare-panel">{{COMPARISON}}</div>
        </main>
    </div>
</div>
</body>
</html>
