# The lab's own tests, on every push and pull request: the unit tests on the
# oldest Node it supports and on the latest 22 and 24, and the tests that need
# Chrome on 24.

name: CI

on:
  push:
    # Dependabot's branches are tested by their pull requests.
    branches-ignore: ['dependabot/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The report's built stylesheets, which the style parity tests check.
      - run: npm run build:report

      - run: npm test

      # Ubuntu 24.04 keeps Chrome's sandbox from starting, and some of these
      # tests launch Chrome with it.
      - name: Tests that need Chrome
        if: matrix.node == '24'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run test:dom
