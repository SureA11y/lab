# The lab's own tests. On main: the unit tests on the oldest Node it supports
# and on the latest 22 and 24. On a pull request: on the oldest and on 24 only,
# as main tests the latest 22 once the change is merged. The tests that need
# Chrome run on 24 in both.

name: CI

on:
  # Other branches are tested by their pull requests, so a commit pushed to a
  # pull request's branch runs once, not twice.
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: read

# A newer push to a pull request makes the run for the older one moot. On main
# every commit is tested to the end: the group is the commit itself.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22.13", "24"]') || fromJSON('["22.13", "22", "24"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The report's built stylesheets, which the style parity tests check.
      - run: npm run build:report

      - run: npm test

      # Ubuntu 24.04 keeps Chrome's sandbox from starting, and some of these
      # tests launch Chrome with it.
      - name: Tests that need Chrome
        if: matrix.node == '24'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run test:dom
