# Weekly updates, grouped so they arrive as one pull request per ecosystem
# rather than one per package. The add-on's engines are left to whoever
# installs it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # jsdom 30 and later need Node 22.22.2; the lab supports 22.13.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
