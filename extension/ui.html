<div class="a11y-ui">
    <div class="topbar">
        <button id="start" class="btn">Start session</button>
        <button id="run" class="btn">A11yScan</button>
        <button id="finish" class="btn" disabled>Finish</button>
        <button id="result" class="btn" disabled>Get result</button>
        <button id="sendToUi" class="btn btn-primary" disabled>Send to UI</button>
        <button id="clear" class="btn btn-danger">Clear session</button>
    </div>

    <div class="card">
        <div class="meta">
            runId: <span id="runId" class="mono">(none)</span>
        </div>

        <div class="grid2">
            <div class="field">
                <label class="label" for="label">Scan label (optional)</label>
                <input id="label" type="text" placeholder="Example: Homepage, Login, Checkout action 2" />
            </div>

            <button data-selector="label" data-selector-type="getText" class="pickerBtn btn" type="button">picker</button>

            <!-- What the scan checks against: one WCAG level (or none), and any
                 standards, as the lab's scan step offers them. The standards
                 of the packs the extension was built with are added at start.
                 Folded, as Advanced options are: its toggle says what the
                 scan checks ("WCAG 2.2 AA"), so the choice is seen closed. -->
            <div class="profiles-disclosure">
                <button type="button"
                        id="profileToggle"
                        class="legend-toggle"
                        aria-expanded="false"
                        aria-controls="profileContent">
                    <span class="legend-toggle-label">Profile</span>
                    <span class="legend-toggle-value" id="profileToggleValue"></span>
                </button>
                <div id="profileContent" class="disclosure-content" hidden>
                    <fieldset class="field profiles" id="profile">
                        <legend class="visually-hidden">Profile</legend>
                        <div class="profiles-groups">
                            <fieldset class="profiles-group">
                                <legend>WCAG 2.2</legend>
                                <label class="profiles-option"><input type="radio" name="profileWcag" value="wcag22-a"> Level A</label>
                                <label class="profiles-option"><input type="radio" name="profileWcag" value="wcag22-aa" checked> Level AA</label>
                                <label class="profiles-option"><input type="radio" name="profileWcag" value="wcag22-aaa"> Level AAA</label>
                                <label class="profiles-option"><input type="radio" name="profileWcag" value=""> Don’t check WCAG</label>
                            </fieldset>
                            <fieldset class="profiles-group" id="profileStandards">
                                <legend>Standards</legend>
                                <label class="profiles-option"><input type="checkbox" name="profileStandard" value="en301549-v4.1.1"> EN 301 549 V4.1.1</label>
                                <label class="profiles-option"><input type="checkbox" name="profileStandard" value="en301549-v3.2.1"> EN 301 549 V3.2.1</label>
                            </fieldset>
                        </div>
                        <p class="profiles-note" id="profileOverlap" hidden></p>
                        <p class="profiles-summary" id="profileSummary" aria-live="polite"></p>
                    </fieldset>
                </div>
            </div>
        </div>

        <div class="advanced">
            <button type="button"
                    id="advancedToggle"
                    class="legend-toggle"
                    aria-expanded="false"
                    aria-controls="advancedContent">
                <span class="legend-toggle-label">Advanced options</span>
                <span class="legend-toggle-badge" id="advancedBadge" hidden></span>
            </button>

            <div id="advancedContent" class="advanced-content disclosure-content" role="region" aria-label="Advanced options" hidden>
            <div class="field">
                <label class="label" for="exclude">Exclude selectors (optional, comma-separated)</label>
                <div class="row-input-button">
                    <input id="exclude" type="text"
                           placeholder="Example: header, .cookie-banner, [data-testid=&quot;ads&quot;]"/>
                    <div class="row-input-button">
                        <button data-selector="exclude" class="pickerBtn btn" type="button">picker</button>
                        <button data-selector="exclude" class="clearBtn btn" type="button">reset</button>
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="label" for="context">Context selectors (optional, comma-separated)</label>
                <div class="row-input-button">
                    <input id="context" type="text" placeholder="Example: main, #app, .checkout"/>
                    <div class="row-input-button">
                        <button data-selector="contentSelector" class="pickerBtn btn" type="button">picker</button>
                        <button data-selector="contentSelector" class="clearBtn btn" type="button">reset</button>
                    </div>
                </div>
            </div>

            <div class="field field-checkbox">
                <input id="includeBestPractice" type="checkbox" />
                <label class="label" for="includeBestPractice">Include best-practice rules</label>
            </div>

            <!-- Pictures of the elements a scan flags, as the lab's scan step
                 takes them (element-screenshots.js): which outcomes, and how
                 many at most in a scan. -->
            <div class="element-shots">
                <div class="field">
                    <label class="label" for="elementShots">Pictures of flagged elements</label>
                    <select id="elementShots">
                        <option value="fail" selected>Failures</option>
                        <option value="failCantTell">Failures and can’t tell</option>
                        <option value="off">None</option>
                    </select>
                </div>
                <div class="field field-compact">
                    <label class="label" for="elementShotsMax">At most, a scan</label>
                    <input id="elementShotsMax" type="number" min="1" step="1" value="50" inputmode="numeric" />
                </div>
            </div>

            <div class="field">
                <label class="label" for="custom-css">Custom CSS (applied automatically when scanning)</label>
                <div class="row-input-button">
                    <textarea id="custom-css" placeholder="Example: .btn-primary { color: #000 !important; }"></textarea>
                    <div>
                        <button id="customCssAdd" type="button" class="btn" disabled>Preview on page</button>
                        <button id="customCssRemove" type="button" class="btn" disabled>Remove preview</button>
                    </div>
                </div>
            </div>
            </div>
        </div>

        <div class="footer">
            <span id="status" class="status" aria-live="polite"></span>
        </div>
    </div>

    <div class="resultsRow">
        <figure id="shotWrap" class="shotWrap" hidden>
            <div id="shotBox" class="shotBox">
                <img id="shotImg" class="shotImg" alt="Screenshot captured after the scan" />
            </div>
            <figcaption id="shotMeta" class="shotMeta"></figcaption>
        </figure>

        <pre id="out" class="out" data-scroll-name="Scan output"></pre>
    </div>
    <div class="download">
        <button id="download" class="btn" disabled>Download</button>
    </div>
</div>
