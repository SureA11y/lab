<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Offers - Demo Shop</title><link rel="stylesheet" href="../style.css">
<style>
  /* Known issues for the focus walk (expected.json): the navigation's focus
     outline removed with nothing in its place; a menu, a tile and a "button"
     that only a mouse can use; a link that comes first in the Tab order
     though it is last on the page; a sticky header and a fixed chat box,
     the chat box over the last offer. */
  nav a:focus { outline: none; }
  /* Help shows focus from a script instead, which no style rule shows: dark,
     3:1 and more against the header (the scan cannot tell, the walk can). */
  nav a.help.on { background: #1d3557; color: #fff; }
  #top-bar { position: sticky; top: 0; z-index: 2; background: #fff; }
  .tile { display: inline-block; width: 150px; padding: 10px; margin: 6px; background: #e9efe9; cursor: pointer; }
  .menu { display: inline-block; margin-left: 12px; padding: 4px 8px; background: #333; color: #fff; cursor: pointer; }
  main { padding-bottom: 140px; }
  #chat { position: fixed; right: 16px; bottom: 16px; width: 240px; height: 96px; background: #234; color: #fff; padding: 8px; border-radius: 8px; }
  #last-offer { display: block; text-align: right; padding-right: 60px; }
</style></head>
<body>
<header id="top-bar"><p><strong>Demo Shop</strong></p><nav aria-label="Main"><a href="../index.html">Home</a><a href="../products.html">Products</a><a href="../cart.html">Cart</a><a href="../index.html#help" class="help" onfocus="this.classList.add('on')" onblur="this.classList.remove('on')">Help</a></nav>
  <span class="menu" id="account-menu" onclick="this.textContent = 'Account (open)'">Account ▾</span></header>
<main>
  <h1>Offers</h1>
  <div class="tile" id="tile-fern" onclick="void 0">Fern<br>12 €</div>
  <span class="tile" id="tile-cactus" role="button">Cactus<br>9 €</span>
  <p><a href="#roses">Roses, 20% off</a> · <a href="#tulips">Tulips, 3 for 2</a></p>
  <div style="height: 480px"></div>
  <p id="last-offer"><a href="#seeds" tabindex="1">Seeds and bulbs: all offers</a></p>
</main>
<div id="chat" role="region" aria-label="Chat">Questions? <button type="button">Open chat</button></div>
</body>
</html>
