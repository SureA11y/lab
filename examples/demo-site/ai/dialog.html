<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Garden gloves - Demo Shop</title><link rel="stylesheet" href="../style.css">
<style>
  /* A known issue for the open walk (expected.json): "Size guide" opens a
     modal dialog that a keyboard user cannot close. Focus stays on the link,
     the only close control is a span (it cannot take focus) and Escape does
     nothing. "Delivery details" opens a section in place, as it should. */
  #guide { position: fixed; inset: 20% 25%; background: #fff; border: 2px solid #333; padding: 16px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.4); }
  #guide .close { position: absolute; top: 6px; right: 10px; cursor: pointer; font-size: 1.4em; }
</style></head>
<body>
<header><p><strong>Demo Shop</strong></p><nav aria-label="Main"><a href="../index.html">Home</a> <a href="../products.html">Products</a></nav></header>
<main>
  <h1>Garden gloves</h1>
  <p>Leather gloves for pruning and planting. <a href="#" id="open-guide">Size guide</a></p>
  <button type="button" id="delivery" aria-expanded="false" aria-controls="delivery-text">Delivery details</button>
  <div id="delivery-text" hidden><p>Delivered in two working days. <a href="../cart.html">Go to the cart</a></p></div>
</main>
<div id="guide" role="dialog" aria-modal="true" aria-labelledby="guide-title" hidden>
  <h2 id="guide-title">Size guide</h2>
  <p>S: up to 19 cm around the hand. M: up to 21 cm. L: above 21 cm. <a href="../products.html">All gloves</a></p>
  <span class="close" title="Close">×</span>
</div>
<script>
  const guide = document.getElementById('guide');
  document.getElementById('open-guide').addEventListener('click', (e) => { e.preventDefault(); guide.hidden = false; });
  guide.querySelector('.close').addEventListener('click', () => { guide.hidden = true; });
  const delivery = document.getElementById('delivery');
  delivery.addEventListener('click', () => {
    const open = delivery.getAttribute('aria-expanded') === 'true';
    delivery.setAttribute('aria-expanded', String(!open));
    document.getElementById('delivery-text').hidden = open;
  });
</script>
</body>
</html>
